server {
    listen 80 default_server;
    server_name 127.0.0.1;

    # Accept only this staging origin, including for requests arriving via DNS rebinding.
    if ($http_host != "127.0.0.1:8088") { return 421; }

    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; frame-src 'self'; object-src 'none'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location ~* ^/wp-content/uploads/.*\.(php[0-9]*|phtml|phar)([./]|$) {
        return 404;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend wordpress:80;
        proxy_pass http://$backend;
        proxy_set_header Host 127.0.0.1:8088;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host 127.0.0.1:8088;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
    }
}
